name: Validate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validation gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: test "$(node --version)" = v26.13.1 && test "$(npm --version)" = 11.20.0
      - run: npm ci
      - run: npm run validate
      - name: Prepare headless Chromium
        run: |
          npx playwright install --only-shell chromium
          probe='import { chromium } from "@playwright/test"; const browser = await chromium.launch(); await browser.close();'
          if ! node --input-type=module -e "$probe"; then
            npx playwright install-deps chromium
            node --input-type=module -e "$probe"
          fi
      - name: Chromium compatibility
        run: |
          for react_version in 16.8.6 16.14.0 17.0.2 18.3.1; do
            REACT_VERSION="$react_version" npm run test:browser -- --project=chromium || exit 1
          done
      - uses: actions/upload-artifact@v7
        with:
          name: local-package
          path: artifacts/react-hex-editor-*.tgz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure
          retention-days: 7
          path: |
            playwright-report
            test-results
